[project]
name = "django-production-boilerplate"
version = "2.0.0"
description = "Production-Ready Django Boilerplate with modern tooling, best practices, and easy project customization"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pallav Rai", email = "pallavrai@example.com"}
]
maintainers = [
    {name = "Pallav Rai", email = "pallavrai@example.com"}
]
keywords = [
    "django",
    "django-rest-framework",
    "postgresql",
    "celery",
    "redis",
    "boilerplate",
    "template",
    "starter",
    "api",
    "backend",
    "postgis",
    "docker",
    "production-ready",
    "modern-django"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/Pallavrai/Django-Setup"
Repository = "https://github.com/Pallavrai/Django-Setup.git"
Documentation = "https://github.com/Pallavrai/Django-Setup#readme"
"Bug Reports" = "https://github.com/Pallavrai/Django-Setup/issues"
"Source Code" = "https://github.com/Pallavrai/Django-Setup"
"Celery Branch" = "https://github.com/Pallavrai/Django-Setup/tree/celery%2Bredis"

dependencies = [
    "Django>=4.2",
    "gunicorn>=20.1.0,<21",
    "python-dotenv>=1.0.1,<2",
    "psycopg2-binary>=2.9.10,<3",
    "pillow>=11.2.1,<12",
    "django-jazzmin>=3.0.1,<4",
    "djangorestframework>=3.16.0,<4",
    "markdown~=3.8",
    "django-filter~=25.1",
    "django-silk>=5.3.2,<6",
    "django-extensions~=4.1",
    "model-bakery>=1.20.4,<2",
    "faker>=37.3.0,<38",
    "drf-spectacular>=0.28.0,<0.29",
    "django-cors-headers>=4.7.0,<5",
    "dj-database-url>=2.3.0,<3",
    "whitenoise>=6.9.0,<7",
    "django-unfold>=0.59.0,<0.60",
    "geopy>=2.4.1,<3",
    "celery>=5.3.0,<6",
    "redis>=5.0.0,<6",
    "django-import-export>=4.3.7,<5",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

