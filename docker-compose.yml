services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ${COMPOSE_PROJECT_NAME:-saferead}_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - django.env
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-saferead}_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-saferead}_app
    restart: always
    env_file:
      - django.env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    command: >
      sh -c "uv run python manage.py makemigrations &&
             uv run python manage.py migrate &&
             uv run python manage.py createAdmin &&
             uv run python manage.py runserver 0.0.0.0:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-saferead}_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - media_data:/app/media
    depends_on:
      - app

  adminer:
    image: adminer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-saferead}_adminer
    restart: always
    env_file:
      - django.env
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  
  celery:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-saferead}_celery
    restart: always
    env_file:
      - django.env
    volumes:
      - .:/app
    command: uv run celery -A config worker --loglevel=info  --pool=prefork --concurrency=8
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  redis_data:
